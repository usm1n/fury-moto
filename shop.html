<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title></title>
  <meta name="description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/video.css">
  <link rel="stylesheet" href="css/components/header.css">
  <link rel="stylesheet" href="css/components/footer.css">
  <link rel="stylesheet" href="css/components/cart.css">
  <link rel="stylesheet" href="css/components/product.css">
  <link rel="stylesheet" href="css/pages/shop.css">
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script type="module">import { boot } from "./js/core/app.js"; addEventListener("DOMContentLoaded", () => boot("shop"));</script>
</head>
<body>
  <a class="skip-link" href="#main" data-bind="ui.skip">Skip to content</a>
  <div data-component="header"></div>
  <main id="main" data-page="shop">
    <section class="shop-head" data-video-slot="shop-header">
      <div class="container shop-head__inner">
        <p class="eyebrow" data-shop="eyebrow"></p>
        <h1 class="shop-head__title" data-shop="title"></h1>
        <p class="shop-head__count muted" data-shop="count" aria-live="polite"></p>
      </div>
    </section>

    <nav class="container shop-cats" data-shop="cats"></nav>

    <div class="container shop-layout">
      <aside class="shop-filters" id="shop-filters" data-shop="filters" aria-label="" role="complementary"></aside>
      <div class="shop-results">
        <div class="shop-bar">
          <button class="btn btn--ghost shop-bar__filters" type="button" data-shop="open-filters" aria-controls="shop-filters" aria-expanded="false"></button>
          <label class="shop-sort">
            <span class="shop-sort__label" data-shop="sort-label"></span>
            <select data-shop="sort"></select>
          </label>
        </div>
        <div class="shop-chips" data-shop="chips"></div>
        <div class="shop-grid" data-shop="grid"></div>
      </div>
    </div>
  </main>
  <div data-component="footer"></div>
  <div data-component="cart-drawer"></div>
</body>
</html>
